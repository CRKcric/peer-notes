<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerNotes - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        .background-orbs {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
        }
        
        .orb1 {
            top: 10%;
            left: 10%;
            width: 400px;
            height: 400px;
            background: rgba(147, 51, 234, 0.3);
        }
        
        .orb2 {
            bottom: 15%;
            right: 15%;
            width: 320px;
            height: 320px;
            background: rgba(59, 130, 246, 0.25);
        }
        
        .orb3 {
            bottom: 30%;
            left: 5%;
            width: 250px;
            height: 250px;
            background: rgba(107, 33, 168, 0.2);
        }
        
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            height: 100vh;
        }
        
        .left-section {
            flex: 1;
            margin-right: 4rem;
        }
        
        .welcome-text {
            font-size: 4.5rem;
            font-weight: bold;
            line-height: 1.1;
            margin-bottom: 2rem;
        }
        
        .divider {
            width: 250px;
            height: 1px;
            background: linear-gradient(to right, white, transparent);
        }
        
        .login-card {
            width: 380px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .login-subtitle {
            color: #d1d5db;
            font-size: 0.9rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .input-field::placeholder {
            color: #9ca3af;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }
        
        .password-container {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
        }
        
        .password-toggle:hover {
            color: white;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .checkbox {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            accent-color: #8b5cf6;
        }
        
        .checkbox-label {
            color: #d1d5db;
            font-size: 0.9rem;
        }
        
        .login-btn {
            width: 100%;
            background: linear-gradient(to right, #8b5cf6, #3b82f6);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 1rem;
        }
        
        .login-btn:hover {
            background: linear-gradient(to right, #7c3aed, #2563eb);
            transform: scale(1.02);
        }
        
        .forgot-password {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .forgot-link {
            color: #d1d5db;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }
        
        .forgot-link:hover {
            color: white;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            margin-right: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-back {
            position: absolute;
            width: 40px;
            height: 32px;
            background: #9333ea;
            border-radius: 8px;
            border: 3px solid #4c1d95;
        }
        
        .logo-front {
            position: absolute;
            width: 32px;
            height: 26px;
            background: #3b82f6;
            border-radius: 6px;
            border: 2px solid #1e40af;
            z-index: 2;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-lines {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .logo-line {
            height: 2px;
            background: white;
            border-radius: 1px;
        }
        
        .logo-line:first-child {
            width: 12px;
        }
        
        .logo-line:last-child {
            width: 8px;
        }
        
        .logo-text {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .peer-text {
            color: #1e40af;
        }
        
        .notes-text {
            color: #1e40af;
        }
        
        .signup-link {
            text-align: center;
        }
        
        .signup-text {
            color: #9ca3af;
            font-size: 0.9rem;
        }
        
        .signup-btn {
            color: #a855f7;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .signup-btn:hover {
            color: #c084fc;
        }
    </style>
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>
    
    <div class="container">
        <div class="left-section">
            <h1 class="welcome-text">Hey, you're back !</h1>
            <div class="divider"></div>
        </div>
        
        <div class="login-card">
            <div class="login-header">
                <h2 class="login-title">Login</h2>
                <p class="login-subtitle">Glad you're back.!</p>
            </div>
            
            <div class="form-group">
                <input type="text" class="input-field" placeholder="Username" id="username">
            </div>
            
            <div class="form-group">
                <div class="password-container">
                    <input type="password" class="input-field" placeholder="Password" id="password">
                    <button class="password-toggle" onclick="togglePassword()">•••</button>
                </div>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" class="checkbox" id="remember">
                <label class="checkbox-label" for="remember">Remember me</label>
            </div>
            
            <button class="login-btn" onclick="handleLogin()">Login</button>
            
            <div class="forgot-password">
                <a href="auth-pages.html#forgot">Forgot password?</a>
            </div>
            <div class="logo">
                <img src="logo.png" alt="Peer Notes Logo" class="logo-image" style="height:40px;width:auto;border-radius:8px;">
           </div>
            
            <div class="signup-link">
                <span class="signup-text">Don't have an account ? </span>
                <a href="auth-pages.html" class="signup-btn">Signup</a>
            </div>
        </div>
    </div>
    
    <script>
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const toggleBtn = document.querySelector('.password-toggle');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleBtn.innerHTML = '👁️';
            } else {
                passwordField.type = 'password';
                toggleBtn.innerHTML = '•••';
            }
        }
        
        function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            console.log('Login attempt:', { username, password, remember });
            
            // Add your login logic here
            alert('Login functionality - connect to your backend!');
        }
        
        // Add some interactive effects
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('.input-field');
            
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.style.transform = 'scale(1.02)';
                });
                
                input.addEventListener('blur', function() {
                    this.style.transform = 'scale(1)';
                });
            });
        });
    </script>
</body>
</html>
