<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reusable Sidebar Component</title>
    <style>
        /* Sidebar Styles */
        .sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transition: right 0.3s ease;
            z-index: 200;
            padding: 2rem;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #8b5cf6;
        }

        .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            color: white;
            transform: scale(1.1);
        }

        .sidebar-nav {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .sidebar-nav li {
            margin-bottom: 1rem;
        }

        .sidebar-nav a {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 1rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .sidebar-nav a:hover {
            background: rgba(139, 92, 246, 0.2);
            color: white;
            transform: translateX(5px);
        }

        .sidebar-nav a.active {
            background: rgba(139, 92, 246, 0.3);
            color: #8b5cf6;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 150;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .menu-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            color: white;
            transform: scale(1.1);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .sidebar {
                width: 280px;
                right: -280px;
            }
        }

        /* Demo styles - remove these in your actual implementation */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: white;
            margin: 0;
            padding: 2rem;
        }

        .demo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .demo-content {
            text-align: center;
            color: #ccc;
        }
    </style>
</head>
<body>
    <!-- Demo Header (replace with your actual header) -->
    <div class="demo-header">
        <h1>Your Page Content</h1>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 class="sidebar-title">Menu</h3>
            <button class="close-btn" onclick="closeSidebar()">×</button>
        </div>
        <ul class="sidebar-nav">
            <li><a href="browse.html" data-page="search">🔍 Browse</a></li>
            <li><a href="dashboard.html" data-page="dashboard">🏠 Dashboard</a></li>
            <li><a href="profile.html" data-page="profile">👤 Profile</a></li>
            <li><a href="upload_form.html" data-page="uploads">📤 Upload</a></li>
            <li><a href="requests.html" data-page="requests">📝 Requests</a></li>
            <li><a href="settings.html" data-page="settings">⚙️ Settings</a></li>
            <li><a href="help.html" data-page="help">❓ Help </a></li>
            <li><a href="auth.html" data-page="auth">🚪 Logout</a></li>
        </ul>
    </nav>

    <!-- Demo Content -->
    <div class="demo-content">
        <p>Click the menu button (☰) in the top right to test the sidebar.</p>
        <p>This is just demo content - replace with your actual page content.</p>
    </div>

    <script>
        // Sidebar functionality
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function closeSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

        // Close sidebar when clicking outside or pressing Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSidebar();
            }
        });

        // Auto-highlight current page in sidebar
        function highlightCurrentPage() {
            const currentPage = window.location.pathname.split('/').pop().replace('.html', '');
            const navLinks = document.querySelectorAll('.sidebar-nav a[data-page]');
            
            navLinks.forEach(link => {
                if (link.dataset.page === currentPage) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        // Initialize sidebar
        document.addEventListener('DOMContentLoaded', function() {
            highlightCurrentPage();
        });

        // Optional: Add smooth scrolling prevention when sidebar is open
        function preventBodyScroll() {
            const sidebar = document.querySelector('.sidebar');
            const body = document.body;
            
            if (sidebar.classList.contains('active')) {
                body.style.overflow = 'hidden';
            } else {
                body.style.overflow = '';
            }
        }

        // Update the toggle function to prevent body scroll
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            preventBodyScroll();
        }

        function closeSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            preventBodyScroll();
        }
    </script>
</body>
</html>
