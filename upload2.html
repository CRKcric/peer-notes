<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Notes - Upload Files</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #8b5cf6 #2d2d44;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #2d2d44;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #8b5cf6, #a855f7);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #7c3aed, #9333ea);
        }

        .container {
            position: relative;
            min-height: 100vh;
            padding: 20px;
            overflow-y: auto;
        }

        /* Decorative circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, rgba(139, 92, 246, 0.3), rgba(168, 85, 247, 0.1));
            z-index: 0;
        }

        /* Floating animations */
        @keyframes float1 {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(10px) rotate(240deg); }
        }

        @keyframes float2 {
            0%, 100% { transform: translateY(0px) rotate(360deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }

        @keyframes float3 {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(15px) rotate(90deg); }
            75% { transform: translateY(-25px) rotate(270deg); }
        }

        .circle1 {
            width: 400px;
            height: 400px;
            top: -100px;
            right: -100px;
            animation: float1 8s ease-in-out infinite;
        }

        .circle2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            left: -50px;
            animation: float2 6s ease-in-out infinite;
        }

        .circle3 {
            width: 200px;
            height: 200px;
            bottom: 100px;
            right: 100px;
            animation: float3 7s ease-in-out infinite;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            overflow: hidden;
        }

        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .logo-text {
            color: #3b82f6;
            font-size: 18px;
            font-weight: bold;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #8b5cf6;
            font-size: 24px;
            cursor: pointer;
        }

        .main-content {
            text-align: center;
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .title {
            color: white;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            color: #a855f7;
            font-size: 18px;
            margin-bottom: 50px;
        }

        .upload-container {
            max-height: 60vh;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 30px;
            scrollbar-width: thin;
            scrollbar-color: #8b5cf6 transparent;
        }

        .upload-container::-webkit-scrollbar {
            width: 6px;
        }

        .upload-container::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.6);
            border-radius: 3px;
        }

        .upload-area {
            width: 100%;
            max-width: 500px;
            height: 300px;
            margin: 0 auto 40px;
            border: 3px dashed rgba(139, 92, 246, 0.5);
            border-radius: 20px;
            background: rgba(75, 85, 99, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
        }

        .upload-area.dragover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.2);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 64px;
            color: #8b5cf6;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .upload-area:hover .upload-icon {
            color: #a855f7;
            transform: scale(1.1);
        }

        .upload-text {
            color: white;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #9ca3af;
            font-size: 14px;
        }

        .file-input {
            display: none;
        }

        .file-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 30px;
            scrollbar-width: thin;
            scrollbar-color: #8b5cf6 transparent;
        }

        .file-list::-webkit-scrollbar {
            width: 6px;
        }

        .file-list::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.6);
            border-radius: 3px;
        }

        .file-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .file-item:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: #8b5cf6;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-icon {
            color: #8b5cf6;
            font-size: 20px;
        }

        .file-details {
            text-align: left;
        }

        .file-name {
            color: white;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .file-size {
            color: #9ca3af;
            font-size: 12px;
        }

        .remove-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 5px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .upload-btn {
            background: linear-gradient(45deg, #8b5cf6, #a855f7);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .upload-btn:active {
            transform: translateY(0);
        }

        .upload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #8b5cf6, #a855f7);
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 36px;
            }
            
            .upload-area {
                height: 250px;
            }
            
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
        
        <header class="header">
            <div class="logo">
                <div class="logo-icon" id="logoContainer">
                    <img src="logo.png" alt="Peer Notes Logo" class="logo-image" style="height:40px;width:auto;border-radius:8px;">
                </div>
                <span class="logo-text">Peer Notes</span>
            </div>
            <button class="menu-btn">≡</button>
        </header>
        
        <main class="main-content">
            <h1 class="title">All set!!!</h1>
            <p class="subtitle">_upload now_</p>
            
            <div class="upload-container">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">+</div>
                    <div class="upload-text">Drop files here or click to browse</div>
                    <div class="upload-subtext">Support: PDF, DOC, DOCX, PPT, PPTX, TXT, Images</div>
                </div>
                
                <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,.jpg,.jpeg,.png,.gif">
                
                <div class="file-list" id="fileList"></div>
                
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            
            <button class="upload-btn" id="uploadBtn" onclick="startUpload()">
                <span>📤</span>
                <span>Upload</span>
            </button>
        </main>
    </div>

    <script>

        let selectedFiles = [];
        
        // File input change handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            handleFiles(e.target.files);
        });
        
        // Drag and drop handlers
        const uploadArea = document.querySelector('.upload-area');
        
        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        
        function handleFiles(files) {
            for (let file of files) {
                if (!selectedFiles.find(f => f.name === file.name && f.size === file.size)) {
                    selectedFiles.push(file);
                }
            }
            displayFiles();
        }
        
        function displayFiles() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            
            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                
                const fileIcon = getFileIcon(file.type);
                const fileSize = formatFileSize(file.size);
                
                fileItem.innerHTML = `
                    <div class="file-info">
                        <div class="file-icon">${fileIcon}</div>
                        <div class="file-details">
                            <div class="file-name">${file.name}</div>
                            <div class="file-size">${fileSize}</div>
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeFile(${index})">Remove</button>
                `;
                
                fileList.appendChild(fileItem);
            });
            
            // Update upload button state
            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.disabled = selectedFiles.length === 0;
        }
        
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            displayFiles();
        }
        
        function getFileIcon(fileType) {
            if (fileType.includes('pdf')) return '📄';
            if (fileType.includes('word') || fileType.includes('document')) return '📝';
            if (fileType.includes('presentation') || fileType.includes('powerpoint')) return '📊';
            if (fileType.includes('image')) return '🖼️';
            if (fileType.includes('text')) return '📃';
            return '📄';
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function startUpload() {
            if (selectedFiles.length === 0) {
                alert('Please select files to upload.');
                return;
            }
            
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const uploadBtn = document.getElementById('uploadBtn');
            
            // Show progress bar
            progressBar.style.display = 'block';
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<span>⏳</span><span>Uploading...</span>';
            
            // Simulate upload progress
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    
                    // Upload complete
                    setTimeout(() => {
                        alert('Files uploaded successfully! 🎉');
                        
                        // Reset form
                        selectedFiles = [];
                        displayFiles();
                        progressBar.style.display = 'none';
                        progressFill.style.width = '0%';
                        uploadBtn.disabled = false;
                        uploadBtn.innerHTML = '<span>📤</span><span>Upload</span>';
                        
                        // Navigate to success page (simulate)
                        // In a real app, you would redirect to the profile page
                    }, 1000);
                } else {
                    progressFill.style.width = progress + '%';
                }
            }, 200);
        }
    </script>
</body>
</html>
