<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerNotes - Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background circles */
        .bg-circle {
            position: fixed;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #ec4899, #f43f5e);
            opacity: 0.6;
            animation: float 8s ease-in-out infinite;
            z-index: -1;
        }

        .bg-circle-1 {
            width: 300px;
            height: 300px;
            top: 10%;
            right: 15%;
            animation-delay: 0s;
        }

        .bg-circle-2 {
            width: 400px;
            height: 400px;
            bottom: 20%;
            left: 10%;
            animation-delay: 2s;
        }

        .bg-circle-3 {
            width: 200px;
            height: 200px;
            bottom: 10%;
            right: 60%;
            animation-delay: 4s;
        }

        .bg-circle-4 {
            width: 250px;
            height: 250px;
            top: 50%;
            right: 80%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1) rotate(0deg); }
            33% { transform: translateY(-30px) scale(1.05) rotate(120deg); }
            66% { transform: translateY(20px) scale(0.95) rotate(240deg); }
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            position: relative;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #60a5fa;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: white;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .menu-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            color: white;
            transform: scale(1.1);
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transition: right 0.3s ease;
            z-index: 200;
            padding: 2rem;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #8b5cf6;
        }

        .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        .sidebar-nav {
            list-style: none;
        }

        .sidebar-nav li {
            margin-bottom: 1rem;
        }

        .sidebar-nav a {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 1rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .sidebar-nav a:hover {
            background: rgba(139, 92, 246, 0.2);
            color: white;
            transform: translateX(5px);
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 150;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }
         /* Custom Scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 12px;
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #8b5cf6 40%, #ec4899 100%);
            border-radius: 8px;
            border: 2px solid #18181b;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #a78bfa 40%, #f472b6 100%);
        }
        ::-webkit-scrollbar-corner {
            background: #18181b;
        }
        html {
            scrollbar-width: thin;
            scrollbar-color: #8b5cf6 #18181b;
        }
        /* Main content */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 120px);
            padding: 2rem;
            position: relative;
            z-index: 5;
        }

        .search-title {
            font-size: 3.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .search-subtitle {
            text-align: center;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 3rem;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 800px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            color: #ec4899;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-select {
            padding: 1rem;
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            appearance: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .form-select:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .form-select option {
            background: #2a2a2a;
            color: white;
        }

        .material-group {
            grid-column: 1 / -1;
            justify-self: center;
            max-width: 400px;
            width: 100%;
        }

        .confirm-btn {
            grid-column: 1 / -1;
            justify-self: center;
            padding: 1rem 3rem;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .search-form {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .search-title {
                font-size: 2.5rem;
            }

            .sidebar {
                width: 280px;
            }
        }
    </style>
</head>
<body>
    <!-- Background circles -->
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
    <div class="bg-circle bg-circle-4"></div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <h3 class="sidebar-title">Menu</h3>
            <button class="close-btn" onclick="closeSidebar()">×</button>
        </div>
        <ul class="sidebar-nav">
            <li><a href="search.html">🔍 Search</a></li>
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li><a href="profile.html">👤 Profile</a></li>
            <li><a href="uploads.html">📤 My Uploads</a></li>
            <li><a href="requests.html">📝 My Requests</a></li>
            <li><a href="settings.html">⚙️ Settings</a></li>
            <li><a href="help.html">❓ Help & Support</a></li>
            <li><a href="auth.html">🚪 Logout</a></li>
        </ul>
    </nav>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <img src="logo.png" alt="Peer Notes Logo" class="logo-image" style="height:40px;width:auto;border-radius:8px;">
            <span class="logo-text">Peer Notes</span>
        </div>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <h1 class="search-title">Let's find it together!!!</h1>
        <div class="search-subtitle">search now</div>
        
        <form class="search-form" id="searchForm">
            <div class="form-group">
                <label class="form-label">Choose your scheme</label>
                <select class="form-select" name="scheme" required>
                    <option value="">SCHEME</option>
                    <option value="btech">B.Tech</option>
                    <option value="mtech">M.Tech</option>
                    <option value="bca">BCA</option>
                    <option value="mca">MCA</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Choose your semester</label>
                <select class="form-select" name="semester" required>
                    <option value="">SEMESTER</option>
                    <option value="1">1st Semester</option>
                    <option value="2">2nd Semester</option>
                    <option value="3">3rd Semester</option>
                    <option value="4">4th Semester</option>
                    <option value="5">5th Semester</option>
                    <option value="6">6th Semester</option>
                    <option value="7">7th Semester</option>
                    <option value="8">8th Semester</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Choose your year</label>
                <select class="form-select" name="year" required>
                    <option value="">YEAR</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="2020">2020</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Choose your branch</label>
                <select class="form-select" name="branch" required>
                    <option value="">BRANCH</option>
                    <option value="cse">Computer Science</option>
                    <option value="ece">Electronics</option>
                    <option value="me">Mechanical</option>
                    <option value="ce">Civil</option>
                    <option value="ee">Electrical</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Choose your subject</label>
                <select class="form-select" name="subject" required>
                    <option value="">SUBJECT</option>
                    <option value="math">Mathematics</option>
                    <option value="physics">Physics</option>
                    <option value="chemistry">Chemistry</option>
                    <option value="programming">Programming</option>
                    <option value="dsa">Data Structures</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Choose module number</label>
                <select class="form-select" name="module" required>
                    <option value="">MODULE</option>
                    <option value="1">Module 1</option>
                    <option value="2">Module 2</option>
                    <option value="3">Module 3</option>
                    <option value="4">Module 4</option>
                    <option value="5">Module 5</option>
                </select>
            </div>

            <div class="form-group material-group">
                <label class="form-label">Choose material type</label>
                <select class="form-select" name="material" required>
                    <option value="">MATERIAL</option>
                    <option value="notes">Notes</option>
                    <option value="assignment">Assignment</option>
                    <option value="previous-paper">Previous Papers</option>
                    <option value="lab-manual">Lab Manual</option>
                    <option value="textbook">Textbook</option>
                </select>
            </div>

            <button type="submit" class="confirm-btn">CONFIRM</button>
        </form>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function closeSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

       

        // Interactive background animation
        document.addEventListener('mousemove', function(e) {
            const circles = document.querySelectorAll('.bg-circle');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;

            circles.forEach((circle, index) => {
                const speed = (index + 1) * 0.3;
                const xOffset = (x - 0.5) * speed * 20;
                const yOffset = (y - 0.5) * speed * 20;
                
                circle.style.transform += ` translate(${xOffset}px, ${yOffset}px)`;
            });
        });
        //test change
        // Add hover effects
        document.querySelectorAll('.confirm-btn').forEach(btn => {
            btn.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-3px) scale(1.02)';
            });
            
            btn.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0) scale(1)';
            });
        });
    </script>
</body>
</html>
