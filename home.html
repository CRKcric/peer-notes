<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerNotes - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: #000;
            color: white;
            min-height: 100vh;
            overflow-y: auto; 
            overflow-x: hidden;
            position: relative;
        }

        /* Custom Scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 12px;
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #8b5cf6 40%, #ec4899 100%);
            border-radius: 8px;
            border: 2px solid #18181b;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #a78bfa 40%, #f472b6 100%);
        }
        ::-webkit-scrollbar-corner {
            background: #18181b;
        }
        html {
            scrollbar-width: thin;
            scrollbar-color: #8b5cf6 #18181b;
        }
        
        .background-orbs {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
        }
        
        .orb1 {
            top: 15%;
            right: 20%;
            width: 350px;
            height: 350px;
            background: rgba(147, 51, 234, 0.4);
        }
        
        .orb2 {
            bottom: 10%;
            left: 10%;
            width: 280px;
            height: 280px;
            background: rgba(107, 33, 168, 0.3);
        }
        
        .orb3 {
            bottom: 20%;
            right: 15%;
            width: 200px;
            height: 200px;
            background: rgba(59, 130, 246, 0.2);
        }
        
        .container {
            position: relative;
            z-index: 2;
            padding: 2rem;
            height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4rem;
        }
        
        .logo {
            display: flex;
            align-items: center;
        }
        
        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }
        
        .menu-btn:hover {
            color: #a855f7;
        }
        
        .main-title {
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 4rem;
            line-height: 1.2;
        }
        
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .category-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
        }
        
        .category-card:hover {
            transform: translateY(-10px) scale(1.05);
        }
        
        .category-icon {
            width: 120px;
            height: 120px;
            background: #c4b5fd;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        
        .category-card:hover .category-icon {
            background: #a78bfa;
            box-shadow: 0 10px 30px rgba(167, 139, 250, 0.3);
        }
        
        .icon-symbol {
            width: 60px;
            height: 60px;
            stroke: white;
            stroke-width: 3;
            fill: none;
        }
        
        .category-title {
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .sidebar {
            position: fixed;
            right: -300px;
            top: 0;
            width: 300px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            transition: right 0.3s ease;
            z-index: 1000;
            padding: 2rem 1rem;
        }
        
        .sidebar.active {
            right: 0;
        }
        
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #333;
        }
        
        .user-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .profile-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #8b5cf6;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }
        
        .sidebar-menu {
            list-style: none;
        }
        
        .sidebar-menu li {
            margin-bottom: 0.5rem;
        }
        
        .sidebar-menu a {
            display: block;
            padding: 1rem;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        
        .sidebar-menu a:hover {
            background: rgba(139, 92, 246, 0.1);
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>
    
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="logo.png" alt="Peer Notes Logo" class="logo-image" style="height:40px;width:auto;border-radius:8px;">
            </div>
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        </header>
        
        <h1 class="main-title">What are you finding today?</h1>
        
        <div class="categories-grid">
            <a href="#" class="category-card" onclick="navigateToCategory('notes')">
                <div class="category-icon">
                    <svg class="icon-symbol" viewBox="0 0 24 24">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
                        <path d="M2 17L12 22L22 17"/>
                        <path d="M2 12L12 17L22 12"/>
                    </svg>
                </div>
                <span class="category-title">NOTES</span>
            </a>
            
            <a href="#" class="category-card" onclick="navigateToCategory('ppt')">
                <div class="category-icon">
                    <svg class="icon-symbol" viewBox="0 0 24 24">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
                        <path d="M2 17L12 22L22 17"/>
                        <path d="M2 12L12 17L22 12"/>
                    </svg>
                </div>
                <span class="category-title">PPT</span>
            </a>
            
            <a href="#" class="category-card" onclick="navigateToCategory('pyq')">
                <div class="category-icon">
                    <svg class="icon-symbol" viewBox="0 0 24 24">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
                        <path d="M2 17L12 22L22 17"/>
                        <path d="M2 12L12 17L22 12"/>
                    </svg>
                </div>
                <span class="category-title">PYQ</span>
            </a>
            
            <a href="#" class="category-card" onclick="openRequestForm(event)">
                <div class="category-icon">
                    <svg class="icon-symbol" viewBox="0 0 24 24">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
                        <path d="M2 17L12 22L22 17"/>
                        <path d="M2 12L12 17L22 12"/>
                    </svg>
                </div>
                <span class="category-title">REQUEST</span>
            </a>
        </div>
    </div>
    
    <!-- Overlay -->
    <div class="overlay" onclick="toggleSidebar()"></div>
    
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3 style="color: #333;">Menu</h3>
            <button class="close-btn" onclick="toggleSidebar()">→</button>
        </div>
        
        <div class="user-profile">
            <div class="profile-icon">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M20 21V19A4 4 0 0 0 16 15H8A4 4 0 0 0 4 19V21"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
        </div>
        
        <ul class="sidebar-menu">
            <li><a href="#profile">Profile</a></li>
            <li><a href="#home">Home</a></li>
            <li><a href="#browse">Browse</a></li>
            <li><a href="#my-notes">My Notes</a></li>
            <li><a href="#upload">Upload</a></li>
            <li><a href="#settings">Settings</a></li>
            <li><a href="#logout">Logout</a></li>
            <li><a href="#help">Help</a></li>
        </ul>
    </div>
    <!-- Request Form Modal -->
    <div class="modal-overlay" id="requestModalOverlay" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.5);z-index:2000;">
        <div class="modal-content" style="background:#18181b;color:white;max-width:400px;margin:8vh auto;padding:2rem;border-radius:16px;position:relative;">
            <button onclick="closeRequestForm()" style="position:absolute;top:1rem;right:1rem;background:none;border:none;color:white;font-size:1.5rem;cursor:pointer;">×</button>
            <h2 style="margin-bottom:1rem;">Request Material</h2>
            <form id="requestForm">
                <div style="margin-bottom:1rem;">
                <input type="text" placeholder="Subject" required style="width:100%;padding:0.7rem;border-radius:8px;border:none;background:#23232b;color:white;">
                </div>
                <div style="margin-bottom:1rem;">
                    <textarea placeholder="Describe your request" required style="width:100%;padding:0.7rem;border-radius:8px;border:none;background:#23232b;color:white;min-height:80px;"></textarea>
                </div>
                <button type="submit" style="width:100%;padding:0.8rem;background:linear-gradient(135deg,#8b5cf6,#ec4899);border:none;border-radius:8px;color:white;font-weight:bold;cursor:pointer;">Submit Request</button>
            </form>
        </div>
    </div>
    
    
    
    <script>
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.overlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }
        
        function openRequestForm(e) {
            e.preventDefault();
            document.getElementById('requestModalOverlay').style.display = 'block';
        }
        
        function closeRequestForm() {
            document.getElementById('requestModalOverlay').style.display = 'none';
        }
        document.getElementById('requestForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Request submitted!');
            closeRequestForm();
        });
        
        function navigateToCategory(category) {
            console.log('Navigating to:', category);
            // Add your navigation logic here
            alert(`Navigating to ${category.toUpperCase()} section`);
        }
        
        // Add hover animations
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.category-card');
            
            cards.forEach(card => {
                card.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-10px) scale(1.05)';
                });
                
                card.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });
        });
        
        // Close sidebar when clicking on overlay
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('overlay') && e.target.classList.contains('active')) {
                toggleSidebar();
            }
        });
    </script>
</body>
</html>
