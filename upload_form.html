<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Notes - Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #8b5cf6 #2d2d44;
            margin: 0;
            padding: 0;
        }

        .page-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(139, 92, 246, 0.3);
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #8b5cf6 transparent;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.6);
            border-radius: 3px;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.3);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .sidebar-logo-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            overflow: hidden;
        }

        .sidebar-logo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .sidebar-logo-text {
            color: #3b82f6;
            font-size: 16px;
            font-weight: bold;
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 8px;
        }

        .sidebar-user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(45deg, #8b5cf6, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .sidebar-user-name {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .sidebar-nav {
            padding: 20px 0;
        }

        .nav-section {
            margin-bottom: 30px;
        }

        .nav-section-title {
            color: #a855f7;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 20px 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #e5e7eb;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-item:hover {
            background: rgba(139, 92, 246, 0.1);
            color: white;
            transform: translateX(5px);
        }

        .nav-item.active {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
            border-right: 3px solid #8b5cf6;
        }

        .nav-icon {
            font-size: 18px;
            width: 20px;
            text-align: center;
        }

        .main-content-wrapper {
            flex: 1;
            margin-left: 0;
            transition: margin-left 0.3s ease;
        }

        .main-content-wrapper.sidebar-open {
            margin-left: 250px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #2d2d44;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #8b5cf6, #a855f7);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #7c3aed, #9333ea);
        }

        .container {
            position: relative;
            min-height: 100vh;
            padding: 20px;
            /* overflow-y: auto; */
        }

        /* Decorative circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, rgba(139, 92, 246, 0.3), rgba(168, 85, 247, 0.1));
            z-index: 0;
        }

        /* Floating animations */
        @keyframes float1 {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(10px) rotate(240deg); }
        }

        @keyframes float2 {
            0%, 100% { transform: translateY(0px) rotate(360deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }

        @keyframes float3 {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(15px) rotate(90deg); }
            75% { transform: translateY(-25px) rotate(270deg); }
        }

        .circle1 {
            width: 400px;
            height: 400px;
            top: -100px;
            right: -100px;
            animation: float1 8s ease-in-out infinite;
        }

        .circle2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            left: -50px;
            animation: float2 6s ease-in-out infinite;
        }

        .circle3 {
            width: 200px;
            height: 200px;
            bottom: 100px;
            right: 100px;
            animation: float3 7s ease-in-out infinite;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .header > .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .profile-avatar {
            margin-left: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            overflow: hidden;
        }

        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .logo-text {
            color: #3b82f6;
            font-size: 18px;
            font-weight: bold;
        }
        .profile-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #8b5cf6;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #23232b;
            margin-left: 20px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .profile-avatar:hover {
            border-color: #a855f7;
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
   
        .menu-btn {
            background: none;
            border: none;
            color: #8b5cf6;
            font-size: 24px;
            cursor: pointer;
            display: block;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .main-content {
            text-align: center;
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .title {
            color: white;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            color: #a855f7;
            font-size: 18px;
            margin-bottom: 50px;
        }

        .form-container {
            /*max-height: 60vh;
            overflow-y: auto; */
            padding: 20px;
            margin-bottom: 30px;
            scrollbar-width: thin;
            scrollbar-color: #8b5cf6 transparent;
        }

        .form-container::-webkit-scrollbar {
            width: 6px;
        }

        .form-container::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.6);
            border-radius: 3px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .form-group {
            text-align: left;
        }

        .form-label {
            display: block;
            color: #a855f7;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            font-size: 16px;
            color: #333;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 12px center;
            background-repeat: no-repeat;
            background-size: 16px;
            transition: all 0.3s ease;
        }

        .form-select:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .form-select:hover {
            border-color: #a855f7;
        }

        .material-select {
            grid-column: 1 / -1;
            max-width: 400px;
            margin: 0 auto;
        }

        .confirm-btn {
            background: linear-gradient(45deg, #8b5cf6, #a855f7);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .confirm-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .title {
                font-size: 36px;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="page-layout">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <img src="logo.png" alt="Peer Notes Logo" class="sidebar-logo-image">
                    </div>
                    <span class="sidebar-logo-text">Peer Notes</span>
                </div>
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar">👤</div>
                    <div class="sidebar-user-name">Student</div>
                </div>
            </div>
            
            <div class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Main</div>
                    <a href="#" class="nav-item" onclick="navigateTo('dashboard')">
                        <span class="nav-icon">🏠</span>
                        <span>Dashboard</span>
                    </a>
                    <a href="#" class="nav-item active" onclick="navigateTo('upload')">
                        <span class="nav-icon">📤</span>
                        <span>Upload Notes</span>
                    </a>
                    <a href="#" class="nav-item" onclick="navigateTo('browse')">
                        <span class="nav-icon">📚</span>
                        <span>Browse Notes</span>
                    </a>
                    <a href="#" class="nav-item" onclick="navigateTo('downloads')">
                        <span class="nav-icon">⬇️</span>
                        <span>My Downloads</span>
                    </a>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Account</div>
                    <a href="#" class="nav-item" onclick="navigateTo('profile')">
                        <span class="nav-icon">👤</span>
                        <span>Profile</span>
                    </a>
                    <a href="#" class="nav-item" onclick="navigateTo('points')">
                        <span class="nav-icon">⭐</span>
                        <span>PeerPoints</span>
                    </a>
                    <a href="#" class="nav-item" onclick="navigateTo('badges')">
                        <span class="nav-icon">🏆</span>
                        <span>Badges</span>
                    </a>
                    <a href="#" class="nav-item" onclick="navigateTo('settings')">
                        <span class="nav-icon">⚙️</span>
                        <span>Settings</span>
                    </a>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Support</div>
                    <a href="#" class="nav-item" onclick="navigateTo('help')">
                        <span class="nav-icon">❓</span>
                        <span>Help Center</span>
                    </a>
                    <a href="#" class="nav-item" onclick="navigateTo('contact')">
                        <span class="nav-icon">📧</span>
                        <span>Contact Us</span>
                    </a>
                    <a href="#" class="nav-item" onclick="navigateTo('logout')">
                        <span class="nav-icon">🚪</span>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </nav>
        
        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
        
        <!-- Main Content -->
        <div class="main-content-wrapper" id="mainContent">
            <div class="container">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
        
        <header class="header">
            <div class="logo"> 
                <img src="logo.png" alt="Peer Notes Logo" class="logo-image" style="height:40px;width:auto;border-radius:8px;">
                <span class="logo-text">Peer Notes</span>
            </div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <div class="profile-avatar" onclick="document.getElementById('avatarInput').click()" title="Change profile picture">
                    <img src="profile.jpg" alt="Profile" id="avatarImg" />
                    <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="changeAvatar(event)">
                </div>
                <button class="menu-btn" id="menuBtn" title="Open sidebar">&#8942;</button>
            </div>
        </header>
        
        <main class="main-content">
            <h1 class="title">You're doing a great job!!!</h1>
            <p class="subtitle">_upload now_</p>
            
            <div class="form-container">
                <form class="form-grid" id="uploadForm">
                    <div class="form-group">
                        <label class="form-label">Choose your scheme</label>
                        <select class="form-select" name="scheme" required>
                            <option value="">SCHEME</option>
                            <option value="btech">B.Tech</option>
                            <option value="mtech">M.Tech</option>
                            <option value="diploma">Diploma</option>
                            <option value="bsc">B.Sc</option>
                            <option value="msc">M.Sc</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Choose your semester</label>
                        <select class="form-select" name="semester" required>
                            <option value="">SEMESTER</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Choose your year</label>
                        <select class="form-select" name="year" required>
                            <option value="">YEAR</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                            <option value="2022">2022</option>
                            <option value="2021">2021</option>
                            <option value="2020">2020</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Choose your branch</label>
                        <select class="form-select" name="branch" required>
                            <option value="">BRANCH</option>
                            <option value="cse">Computer Science</option>
                            <option value="ece">Electronics & Communication</option>
                            <option value="me">Mechanical Engineering</option>
                            <option value="ce">Civil Engineering</option>
                            <option value="ee">Electrical Engineering</option>
                            <option value="it">Information Technology</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Choose your subject</label>
                        <select class="form-select" name="subject" required>
                            <option value="">SUBJECT</option>
                            <option value="math">Mathematics</option>
                            <option value="physics">Physics</option>
                            <option value="chemistry">Chemistry</option>
                            <option value="programming">Programming</option>
                            <option value="data-structures">Data Structures</option>
                            <option value="algorithms">Algorithms</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Choose module number</label>
                        <select class="form-select" name="module" required>
                            <option value="">MODULE</option>
                            <option value="1">Module 1</option>
                            <option value="2">Module 2</option>
                            <option value="3">Module 3</option>
                            <option value="4">Module 4</option>
                            <option value="5">Module 5</option>
                            <option value="6">Module 6</option>
                        </select>
                    </div>
                    
                    <div class="form-group material-select">
                        <label class="form-label">Choose material type</label>
                        <select class="form-select" name="material" required>
                            <option value="">MATERIAL</option>
                            <option value="notes">Notes</option>
                            <option value="assignment">Assignment</option>
                            <option value="question-paper">Question Paper</option>
                            <option value="lab-manual">Lab Manual</option>
                            <option value="presentation">Presentation</option>
                            <option value="book">Book/Reference</option>
                        </select>
                    </div>
                </form>
            </div>
            
            <button class="confirm-btn" onclick="proceedToUpload()">CONFIRM</button>
        </main>
    </div>

    <script>
        function changeAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarImg').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
        function proceedToUpload() {
            const form = document.getElementById('uploadForm');
            const formData = new FormData(form);
            
            // Check if all fields are filled
            let allFilled = true;
            for (let [key, value] of formData.entries()) {
                if (!value) {
                    allFilled = false;
                    break;
                }
            }
            
            if (allFilled) {
                // Store form data for next page
                const data = {};
                for (let [key, value] of formData.entries()) {
                    data[key] = value;
                }
                localStorage.setItem('uploadFormData', JSON.stringify(data));
                
                // Simulate navigation to upload page
                alert('Form submitted successfully! Proceeding to upload page...');
                // In a real app, you would navigate to the next page here
            } else {
                alert('Please fill all fields before proceeding.');
            }
        }

        // Add some interactive effects
        document.querySelectorAll('.form-select').forEach(select => {
            select.addEventListener('change', function() {
                this.style.borderColor = '#8b5cf6';
                setTimeout(() => {
                    this.style.borderColor = 'rgba(139, 92, 246, 0.3)';
                }, 300);
            });
        });
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.getElementById('menuBtn');
        const mainContent = document.getElementById('mainContent');
        
        function openSidebar() {
            sidebar.classList.add('open');
            sidebarOverlay.classList.add('active');
            mainContent.classList.add('sidebar-open');
        } 
        function closeSidebar() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
            mainContent.classList.remove('sidebar-open');
        }
        menuBtn.addEventListener('click', openSidebar);
    </script>
</body>
</html>
